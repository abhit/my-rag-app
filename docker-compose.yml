services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_backend
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  rag-app:
    build: .
    container_name: streamlit_frontend
    ports:
      - "8501:8501"
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434

# ------------------------------------------------------------
# IMPORTANT: The word 'volumes' below must be all the way
# to the left. Do NOT add spaces before it.
# ------------------------------------------------------------
volumes:
  ollama_storage: